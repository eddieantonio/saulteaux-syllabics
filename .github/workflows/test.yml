name: Run unit tests
on: [push]

strategy:
  matrix:
    # As of 2026-11-12, these are the currently maintained Node versions:
    node-version:
    - '24.x' # Maintenance
    - '26.x' # Active LTS

steps:
- uses: actions/checkout@v7
- name: Uses Node.JS ${{ matrix.node-version }}
  uses: actions/setup-node@v7
  with:
    node-version: ${{ matrix.node-version }} 
- run: npm ci
- run: npm test

