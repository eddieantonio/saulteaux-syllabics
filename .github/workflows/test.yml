name: Run unit tests
on: [push]

jobs:
  unit-tests:
    strategy:
      matrix:
        node-version:
        - '26.x' # Current active LTS, as of 2026-11-13
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Unit tests on Node.JS ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }} 
    - run: npm ci
    - run: npm test

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Cypress run
      uses: cypress-io/github-action@v7
      with:
        build: npm run build
        start: npm start
